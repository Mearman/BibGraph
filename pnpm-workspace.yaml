packages:
  # Applications
  - "apps/*"

  # Shared packages
  - "packages/*"

dangerouslyAllowAllBuilds: true

saveExact: true

minimumReleaseAgeExclude:
  - "@exadev/eslint-config"

# Sibling dependencies link from the workspace whenever the declared range is satisfied by the workspace version, rather than resolving from the registry.
linkWorkspacePackages: true

# Supply-chain freshness gate (documents.js house setting): every third-party dependency must have been public for an hour before it can install. Same-day releases of compromised packages are the window this closes.
minimumReleaseAge: 60

# Security pins for transitively-locked vulnerable versions. The koa/glob/body-parser pins carried over from the package.json pnpm field, which pnpm 10 stopped reading -- they were inert there, and activating them here is the first time they have actually applied. The rest pin advisory-affected transitive resolutions that pnpm otherwise holds where the lockfile locked them; every value is an open range so later patches keep flowing.
overrides:
  koa: 3.2.1
  glob: 11.1.0
  body-parser: 2.2.1
  "@babel/plugin-transform-modules-systemjs": 7.29.8
  "@isaacs/brace-expansion": 5.0.1
  "brace-expansion@^1": 1.1.18
  "brace-expansion@^2": 2.1.4
  browserslist: 4.28.9
  effect: 3.20.0
  fast-uri: 3.1.7
  flatted: 3.4.2
  handlebars: 4.7.9
  js-yaml: 4.3.2
  lodash: 4.18.1
  lodash-es: 4.18.1
  "minimatch@^3": 3.1.4
  "minimatch@^5": 5.1.8
  "nanoid@^3": 3.3.18
  "picomatch@^2": 2.3.2
  "picomatch@^4": 4.0.4
  "minimatch@^9": 9.0.7
  "minimatch@^10": 10.2.3
  "@babel/core": 7.29.6
  "@humanfs/node": 0.16.8
  "ajv@^6": 6.14.0
  "ajv@^8": 8.18.0
  diff: 8.0.3
  dompurify: 3.4.13
  "fflate@^0.4": 0.4.9
  "fflate@^0.6": 0.6.11
  "fflate@^0.8": 0.8.3
  smol-toml: 1.8.0
  "yaml@^1": 1.10.3
  "yaml@^2": 2.8.3
  postcss: 8.5.23
  rollup: 4.59.0
  serialize-javascript: 7.1.1
  seroval: 1.6.4
  # unicorn 74 imports @typescript-eslint's type-graph; two different copies
  # (one under its peer suffix, one hoisted) crash with "mapTypes.union is not
  # a function". One version workspace-wide.
  "@typescript-eslint/utils": 8.69.0
  "@typescript-eslint/types": 8.69.0
  # seroval 1.6.5+ drops the isStream export that seroval-plugins 1.6.4 and
  # earlier import; 1.6.5/1.6.6 are inside the seven-day window anyway.
  "seroval-plugins": 1.6.4
  # vitest 5.x is excluded for this repo; 4.1.x is the tested line
  vitest: 4.1.11
  "@vitest/coverage-v8": 4.1.11
  "@vitest/ui": 4.1.11
  storybook: 10.6.0
  undici: 7.29.0
  ws: 8.21.0
